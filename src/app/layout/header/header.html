<header class="header">
  <div class="header__start">
    <a href="#" class="header__logo">
      <span class="header__logo-icon">F</span>
      <span class="header__logo-title">Filmoteka</span>
    </a>

    <nav class="header__nav">
      <a href="#" class="header__link header__link--active">Популярне</a>
      <a href="#" class="header__link">Пошук</a>
      <a href="#" class="header__link">Мій список</a>
    </nav>
  </div>
  <div class="header__end">
    <input #searchInput type="search" [(ngModel)]="query" class="header__input" placeholder="Пошук фільмів"
      aria-label="Пошук фільмів" (keyup)="searchWithEnter($event)" />
    <button type="button" class="header__search-btn" (click)="search()">
      <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 24 24">
        <path d="M0 0h24v24H0z" fill="none" />
        <path fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="2"
          d="m21 21l-4.486-4.494M19 10.5a8.5 8.5 0 1 1-17 0a8.5 8.5 0 0 1 17 0Z" />
      </svg>
    </button>
    <button type="button" class="header__cta">Увійти</button>
  </div>
</header>
