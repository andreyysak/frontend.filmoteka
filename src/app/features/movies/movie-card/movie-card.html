@let title = movie().title;
@let rating = movie().vote_average;

<div class="movie-card">
  <div class="movie-card__poster">
    <img class="movie-card__img" [src]="posterUrl()" [alt]="title" loading="lazy" />
    <span class="movie-card__rate">★ {{ rating | number: '1.1-1' }}</span>
  </div>
  <div class="movie-card__info">
    <div class="movie-card__info-main">
      <h3 class="movie-card__title">{{ title }}</h3>
      <span class="movie-card__year">{{ year() }}</span>
    </div>
    <button type="button" class="movie-card__add" (click)="onAddToWatchlist()"
      [attr.aria-label]="addLabel()">
      +
    </button>
  </div>
</div>
